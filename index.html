<script>
'use strict';const $=id=>document.getElementById(id),KEY='shelf_books_v1',SK='shelf_settings_v102';let books=[],settings={fontSize:20,margin:'normal',fontFamily:'serif',theme:'sepia',line:1.65,animation:'curl'};let storageBroken=false;try{let raw=localStorage.getItem(KEY)??localStorage.getItem('shelf_books');books=raw?JSON.parse(raw):[];if(!Array.isArray(books))throw Error();settings={...settings,...JSON.parse(localStorage.getItem(SK)||'{}')}}catch(e){storageBroken=true;alert('Не удалось прочитать сохранение. Оно не перезаписано. Сделайте резервную копию или восстановите корректный JSON.')}let active=null,pages=[],index=0,busy=false,timer,tapTimer,lastTap=null;

function renderMarks(){let box=$('marks');box.replaceChildren();active.marks104.forEach(a=>{let n=locate(a),b=document.createElement('button');b.textContent='🔖 '+(n+1);b.onclick=()=>{index=n;render();$('panel').classList.remove('open')};box.append(b)})}
