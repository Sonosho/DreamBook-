<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Полка — Читалка v1.03</title>

  <!-- PWA & Mobile Web App Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Читалка">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2c221e">

  <!-- Векторная мобильная иконка -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%238d2b2b'/%3E%3Cpath d='M110 120c45-20 95-20 146 0 51-20 101-20 146 0v240c-45-20-95-20-146 0-51-20-101-20-146 0z' fill='%23fbf0d9'/%3E%3Cpath d='M256 120v240' stroke='%233e2723' stroke-width='14' stroke-linecap='round'/%3E%3Cpath d='M130 180c35-15 80-15 110 0M130 230c35-15 80-15 110 0M130 280c35-15 80-15 110 0M272 180c30-15 75-15 110 0M272 230c30-15 75-15 110 0M272 280c30-15 75-15 110 0' stroke='%23c7b299' stroke-width='8' stroke-linecap='round'/%3E%3Cpath d='M380 120v110l-25-20-25 20v-110' fill='%23d84315'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%238d2b2b'/%3E%3Cpath d='M110 120c45-20 95-20 146 0 51-20 101-20 146 0v240c-45-20-95-20-146 0-51-20-101-20-146 0z' fill='%23fbf0d9'/%3E%3Cpath d='M256 120v240' stroke='%233e2723' stroke-width='14' stroke-linecap='round'/%3E%3Cpath d='M130 180c35-15 80-15 110 0M130 230c35-15 80-15 110 0M130 280c35-15 80-15 110 0M272 180c30-15 75-15 110 0M272 230c30-15 75-15 110 0M272 280c30-15 75-15 110 0' stroke='%23c7b299' stroke-width='8' stroke-linecap='round'/%3E%3Cpath d='M380 120v110l-25-20-25 20v-110' fill='%23d84315'/%3E%3C/svg%3E">

  <style>
    :root {
      /* Светлый текстурированный фон полки */
      --shelf-bg: #453428;
      --shelf-wood: #26170f;
      --shelf-plank: #7c553b;

      /* Цвета книги по умолчанию (Сепия) */
      --reader-bg: #f4ebd8;
      --reader-spine: #dfd4be;
      --reader-text: #2c241c;
      --reader-sub: #827263;
      --reader-border: rgba(44, 36, 28, 0.12);

      --accent: #d84315;
      --accent-hover: #bf360c;
    }

    /* Темы читалки */
    body.theme-sepia {
      --reader-bg: #f4ebd8;
      --reader-spine: #dfd4be;
      --reader-text: #2c241c;
      --reader-sub: #827263;
      --reader-border: rgba(44, 36, 28, 0.12);
    }
    body.theme-day {
      --reader-bg: #faf7f2;
      --reader-spine: #e8e3dc;
      --reader-text: #1d1d1f;
      --reader-sub: #86868b;
      --reader-border: rgba(0, 0, 0, 0.08);
    }
    body.theme-night {
      --reader-bg: #18181c;
      --reader-spine: #111114;
      --reader-text: #d8d8e0;
      --reader-sub: #787885;
      --reader-border: rgba(255, 255, 255, 0.1);
    }
    body.theme-mint {
      --reader-bg: #e6ede4;
      --reader-spine: #cfded0;
      --reader-text: #1d3322;
      --reader-sub: #637a68;
      --reader-border: rgba(29, 51, 34, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-color: var(--shelf-bg);
      background-image: 
        repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 2px, transparent 2px, transparent 40px),
        linear-gradient(180deg, #3d2d22 0%, #291c14 100%);
      color: #fff;
    }

    /* Шапка полки */
    header {
      padding: 0.9rem 1.25rem;
      background: rgba(30, 20, 15, 0.8);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .brand-icon {
      width: 34px;
      height: 34px;
      background: #8d2b2b;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 1.15rem;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    }
    .brand-text h1 {
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .brand-text span {
      font-size: 0.72rem;
      color: #dfcdbf;
      display: block;
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: background 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    button:hover { background: var(--accent-hover); }

    /* Полка */
    .shelf-container {
      flex: 1;
      padding: 2.5rem 1.25rem;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }
    .shelf-row {
      margin-bottom: 3.5rem;
    }
    .books-grid {
      display: flex;
      gap: 1.35rem;
      align-items: flex-end;
      padding: 0 0.8rem 0.2rem;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }
    .books-grid::-webkit-scrollbar { height: 6px; }
    .books-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

    /* Деревянная полка */
    .wood-board {
      height: 20px;
      background: linear-gradient(180deg, var(--shelf-plank) 0%, var(--shelf-wood) 100%);
      border-radius: 4px;
      box-shadow: 0 16px 28px rgba(0,0,0,0.65), inset 0 2px 2px rgba(255,255,255,0.25);
      position: relative;
    }
    .wood-board::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 2%;
      right: 2%;
      height: 14px;
      background: rgba(0,0,0,0.55);
      filter: blur(8px);
    }

    /* Книга на полке */
    .book-item {
      flex-shrink: 0;
      width: 126px;
      height: 182px;
      border-radius: 3px 10px 10px 3px;
      padding: 0.9rem 0.8rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: -5px 0 10px rgba(0,0,0,0.55), 6px 10px 22px rgba(0,0,0,0.45);
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s;
      user-select: none;
    }
    .book-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 10px;
      background: linear-gradient(90deg, rgba(255,255,255,0.3) 0%, rgba(0,0,0,0.25) 100%);
      border-radius: 3px 0 0 3px;
    }
    .book-item:hover {
      transform: translateY(-12px) rotate(-1deg);
      box-shadow: -6px 14px 28px rgba(0,0,0,0.65);
    }
    .book-title {
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.25;
      text-shadow: 0 1px 3px rgba(0,0,0,0.65);
      word-break: break-word;
    }
    .book-meta {
      font-size: 0.72rem;
      opacity: 0.9;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .bookmark-flag {
      font-size: 0.9rem;
    }

    /* ========================================================
       ПОЛНОЭКРАННАЯ ЧИТАЛКА (FULLSCREEN READER v1.03)
       ======================================================== */
    .reader-screen {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: var(--reader-bg);
      color: var(--reader-text);
      z-index: 1000;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .reader-screen.active {
      display: flex;
    }

    /* 3D Сцена книги */
    .reader-stage {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      perspective: 2200px;
      perspective-origin: center center;
    }

    /* Листы книги */
    .page-surface {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 20px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 20px);
      background: var(--reader-bg);
      box-shadow: inset 18px 0 28px rgba(0,0,0,0.04);
    }

    /* Текст книги */
    .book-body {
      flex: 1;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: var(--font-size, 1.12rem);
      line-height: var(--line-height, 1.72);
      font-family: var(--font-family, Georgia, "Times New Roman", serif);
      padding: 1.2rem var(--margin-h, 1.2rem) 1rem;
      scrollbar-width: none;
    }
    .book-body::-webkit-scrollbar { display: none; }

    .reader-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem var(--margin-h, 1.2rem);
      font-size: 0.78rem;
      color: var(--reader-sub);
      border-top: 1px solid var(--reader-border);
    }

    /* ========================================================
       РЕАЛИСТИЧНЫЙ ЛИСТ ПЕРЕЛИСТЫВАНИЯ С ОБЪЕМНОЙ ТЕНЬЮ (3D)
       ======================================================== */
    .flipping-leaf {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
      z-index: 40;
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }
    .flipping-leaf.active-forward {
      display: block;
      transform-origin: left center;
      animation: flipBookForward 0.52s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }
    .flipping-leaf.active-back {
      display: block;
      transform-origin: right center;
      animation: flipBookBack 0.52s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }

    @keyframes flipBookForward {
      0% {
        transform: rotateY(0deg);
        box-shadow: -10px 0 35px rgba(0,0,0,0.1);
      }
      45% {
        box-shadow: -25px 0 50px rgba(0,0,0,0.35);
      }
      100% {
        transform: rotateY(-180deg);
        box-shadow: 0 0 0 rgba(0,0,0,0);
      }
    }

    @keyframes flipBookBack {
      0% {
        transform: rotateY(0deg);
        box-shadow: 10px 0 35px rgba(0,0,0,0.1);
      }
      45% {
        box-shadow: 25px 0 50px rgba(0,0,0,0.35);
      }
      100% {
        transform: rotateY(180deg);
        box-shadow: 0 0 0 rgba(0,0,0,0);
      }
    }

    /* Тень изгиба листа */
    .leaf-shading {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(0,0,0,0.18) 0%, rgba(255,255,255,0.15) 30%, rgba(0,0,0,0.22) 100%);
      opacity: 0.8;
    }

    /* ========================================================
       КРАСИВАЯ ПОЛУПРОЗРАЧНАЯ ЗАКЛАДКА (НЕ ЗАКРЫВАЕТ ТЕКСТ)
       ======================================================== */
    .translucent-ribbon {
      position: absolute;
      top: 0;
      right: 28px;
      width: 26px;
      height: 90px;
      z-index: 25;
      pointer-events: none;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);
      /* Матовое стекло и мягкая полупрозрачность */
      backdrop-filter: blur(1.5px);
      -webkit-backdrop-filter: blur(1.5px);
      border-left: 1px solid rgba(255,255,255,0.35);
      border-right: 1px solid rgba(0,0,0,0.15);
      box-shadow: 0 8px 16px rgba(0,0,0,0.22);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
      transform: translateY(-100%);
      opacity: 0;
    }
    .translucent-ribbon.visible {
      transform: translateY(0);
      opacity: 0.85;
    }
    /* Индикатор автозакладки (там где остановился) */
    .translucent-ribbon.auto-mode {
      height: 44px;
      opacity: 0.55;
      border-bottom: 2px dashed rgba(255,255,255,0.4);
    }

    /* Всплывающие подсказки и бейджи */
    .toast-pill {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 20px);
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(18, 18, 22, 0.88);
      color: #fff;
      font-size: 0.82rem;
      padding: 0.45rem 1rem;
      border-radius: 24px;
      pointer-events: none;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      z-index: 1200;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .toast-pill.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ========================================================
       ПЛАВАЮЩЕЕ МЕНЮ (HUD), ОТКРЫВАЕМОЕ И ЗАКРЫВАЕМОЕ СВАЙПОМ ВВЕРХ
       ======================================================== */
    .reader-hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.28s ease, visibility 0.28s;
      z-index: 100;
    }
    .reader-hud.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .hud-topbar {
      padding: calc(env(safe-area-inset-top, 0px) + 0.8rem) 1.2rem 0.8rem;
      background: rgba(22, 22, 26, 0.88);
      backdrop-filter: blur(14px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      transform: translateY(-20px);
      transition: transform 0.3s ease;
    }
    .reader-hud.active .hud-topbar {
      transform: translateY(0);
    }

    .hud-title {
      font-size: 0.92rem;
      font-weight: 600;
      max-width: 55%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hud-btn {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: none;
      padding: 0.45rem 0.8rem;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .hud-btn.active-bm {
      background: var(--accent);
    }

    .hud-bottombar {
      padding: 1.2rem 1.25rem calc(env(safe-area-inset-bottom, 0px) + 1.2rem);
      background: rgba(22, 22, 26, 0.94);
      backdrop-filter: blur(18px);
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
      border-radius: 20px 20px 0 0;
      transform: translateY(30px);
      transition: transform 0.3s ease;
    }
    .reader-hud.active .hud-bottombar {
      transform: translateY(0);
    }

    /* Настройки в HUD */
    .scrubber-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .scrubber-row span {
      font-size: 0.78rem;
      color: #aaa;
      min-width: 62px;
      text-align: center;
    }
    .scrubber {
      flex: 1;
      height: 6px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.8rem;
    }
    .control-label {
      font-size: 0.82rem;
      color: #bbb;
      min-width: 70px;
    }
    .btn-group {
      display: flex;
      gap: 0.4rem;
      flex: 1;
      justify-content: flex-end;
    }
    .hud-opt-btn {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .hud-opt-btn.selected {
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }

    .theme-picker {
      display: flex;
      gap: 0.65rem;
    }
    .theme-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .theme-dot.selected {
      border-color: var(--accent);
      transform: scale(1.1);
    }

    .hud-hint-swipe {
      text-align: center;
      font-size: 0.72rem;
      color: #888;
      margin-top: -0.4rem;
    }

    /* Модалка добавления книги */
    .add-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      z-index: 1500;
    }
    .add-modal.active { display: flex; }
    .add-box {
      background: #242220;
      width: 100%;
      max-width: 440px;
      padding: 1.5rem;
      border-radius: 14px;
      box-shadow: 0 24px 48px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      color: #fff;
    }
    .add-box h2 { font-size: 1.18rem; }
    .add-box input, .add-box textarea, .add-box select {
      width: 100%;
      padding: 0.65rem 0.8rem;
      background: #181715;
      border: 1px solid #443c36;
      border-radius: 7px;
      color: #fff;
      font-size: 0.9rem;
      font-family: inherit;
    }
    .add-box textarea { resize: vertical; min-height: 110px; }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.6rem;
    }
    .btn-cancel { background: #3c3834; }
  </style>
</head>
<body class="theme-sepia">

  <header>
    <div class="brand">
      <div class="brand-icon">📖</div>
      <div class="brand-text">
        <h1>Книжная Полка</h1>
        <span>Версия 1.03 • 3D Страницы & Свайп-меню</span>
      </div>
    </div>
    <button id="open-add-dialog">+ Добавить книгу</button>
  </header>

  <div class="shelf-container">
    <div class="shelf-row">
      <div class="books-grid" id="bookshelf"></div>
      <div class="wood-board"></div>
    </div>
  </div>

  <!-- ПОЛНОЭКРАННАЯ ЧИТАЛКА v1.03 -->
  <div class="reader-screen" id="reader-screen">
    <div class="toast-pill" id="toast-pill"></div>

    <div class="reader-stage" id="reader-stage">
      <!-- Полупрозрачная закладка (текст просвечивает сквозь нее) -->
      <div class="translucent-ribbon" id="translucent-ribbon"></div>

      <!-- Основная страница книги -->
      <div class="page-surface" id="main-page-surface">
        <div class="book-body" id="book-body"></div>
        <div class="reader-footer">
          <span id="footer-page-info">Стр. 1 из 1</span>
          <span id="footer-book-author">Автор</span>
        </div>
      </div>

      <!-- Анимированный лист для реалистичного 3D перелистывания -->
      <div class="flipping-leaf page-surface" id="flipping-leaf">
        <div class="book-body" id="leaf-body"></div>
        <div class="reader-footer">
          <span id="leaf-page-info"></span>
          <span id="leaf-book-author"></span>
        </div>
        <div class="leaf-shading"></div>
      </div>
    </div>

    <!-- МЕНЮ НАСТРОЕК (HUD), ВЫЗЫВАЕТСЯ И СКРЫВАЕТСЯ СВАЙПОМ ВВЕРХ -->
    <div class="reader-hud" id="reader-hud">
      <div class="hud-topbar">
        <button class="hud-btn" id="hud-back-btn">← Полка</button>
        <span class="hud-title" id="hud-book-title">Название книги</span>
        <button class="hud-btn" id="hud-bookmark-btn">🔖 Закладка</button>
      </div>

      <div class="hud-bottombar">
        <div class="hud-hint-swipe">Свайп вверх — скрыть меню</div>

        <!-- Ползунок страниц -->
        <div class="scrubber-row">
          <input type="range" class="scrubber" id="page-scrubber" min="1" max="1" value="1">
          <span id="scrubber-label">1 / 1</span>
        </div>

        <!-- Размер шрифта -->
        <div class="control-row">
          <span class="control-label">Шрифт</span>
          <div class="btn-group">
            <button class="hud-opt-btn" id="font-dec">A -</button>
            <span style="font-size: 0.85rem; padding: 0 0.5rem; display: flex; align-items: center;" id="font-size-label">18px</span>
            <button class="hud-opt-btn" id="font-inc">A +</button>
          </div>
        </div>

        <!-- Поля страницы -->
        <div class="control-row">
          <span class="control-label">Отступы</span>
          <div class="btn-group">
            <button class="hud-opt-btn" data-margin="narrow">Узкие</button>
            <button class="hud-opt-btn selected" data-margin="normal">Средние</button>
            <button class="hud-opt-btn" data-margin="wide">Широкие</button>
          </div>
        </div>

        <!-- Гарнитура -->
        <div class="control-row">
          <span class="control-label">Гарнитура</span>
          <div class="btn-group">
            <button class="hud-opt-btn selected" data-font="serif">С засечками</button>
            <button class="hud-opt-btn" data-font="sans">Без засечек</button>
          </div>
        </div>

        <!-- Цветовая тема -->
        <div class="control-row">
          <span class="control-label">Тема</span>
          <div class="theme-picker">
            <div class="theme-dot selected" data-theme="sepia" style="background: #f4ebd8;" title="Сепия"></div>
            <div class="theme-dot" data-theme="day" style="background: #faf7f2;" title="День"></div>
            <div class="theme-dot" data-theme="mint" style="background: #e6ede4;" title="Мята"></div>
            <div class="theme-dot" data-theme="night" style="background: #18181c;" title="Ночь"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Модалка добавления книги -->
  <div class="add-modal" id="add-modal">
    <div class="add-box">
      <h2>Добавить книгу на полку</h2>
      <input type="text" id="new-title" placeholder="Название книги" required>
      <input type="text" id="new-author" placeholder="Автор">
      <select id="new-color">
        <option value="#8d2b2b">Бордовый переплет (Рубиновая закладка)</option>
        <option value="#1b5e20">Изумрудный переплет (Изумрудная закладка)</option>
        <option value="#0d47a1">Синий сапфир (Сапфировая закладка)</option>
        <option value="#4a148c">Фиолетовый переплет (Аметистовая закладка)</option>
        <option value="#b26a00">Охристый переплет (Янтарная закладка)</option>
        <option value="#263238">Графитовый переплет (Дымчатая закладка)</option>
      </select>
      <textarea id="new-text" placeholder="Вставьте текст. Двойной перенос строки (Enter дважды) автоматически делит текст на страницы."></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancel-add">Отмена</button>
        <button id="save-book">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'shelf_books_v1';
    const SETTINGS_KEY = 'shelf_settings_v102';

    // Цвета полупрозрачных закладок по тонам книг
    const ribbonColorMap = {
      '#8d2b2b': 'rgba(216, 67, 21, 0.45)',  // Рубин
      '#1b5e20': 'rgba(46, 125, 50, 0.45)',  // Изумруд
      '#0d47a1': 'rgba(21, 101, 192, 0.45)', // Сапфир
      '#4a148c': 'rgba(123, 31, 162, 0.45)', // Аметист
      '#b26a00': 'rgba(245, 124, 0, 0.45)',  // Янтарь
      '#263238': 'rgba(84, 110, 122, 0.45)'  // Дымчатый
    };

    const defaultBooks = [
      {
        id: "b1",
        title: "Остров Сокровищ",
        author: "Р. Л. Стивенсон",
        color: "#1b5e20",
        currentPage: 0,
        bookmarks: [1],
        pages: [
          "Глава I. Старый морской волк в трактире «Адмирал Бенбоу».\n\nСквайр Трелони, доктор Ливси и другие джентльмены попросили меня написать все, что я знаю об Острове Сокровищ от первого до последнего слова, не скрывая ничего, кроме географического положения острова, да и то лишь потому, что сокровища еще не вывезены до конца.\n\nИ вот я берусь за перо в нынешнем 17... году и мысленно возвращаюсь к тому времени, когда мой отец держал трактир «Адмирал Бенбоу»...",
          "Помню, как незнакомец тяжело ступал к нашей двери, а за ним катили на тачке его просмоленный морской сундук. Это был высокий, плотный, загорелый мужчина с просмоленной косичкой над воротником засаленного синего кафтана.\n\nНа щеке у него белел сабельный шрам. Он свистнул, оглядел бухту и затянул старую матросскую песню:\n\n«Пятнадцать человек на сундук мертвеца, йо-хо-хо, и бутылка рому!»",
          "Капитан целыми днями бродил вокруг бухты или взбирался на желтые утесы с медной зрительной трубой. По вечерам он сидел у пылающего камина и молча цедил разбавленный ром.\n\nБольше всего на свете он боялся появления одноногого моряка. Каждому из нас он обещал серебряную монету в четыре пенса, если мы вовремя предупредим его об опасности."
        ]
      },
      {
        id: "b2",
        title: "Машина Времени",
        author: "Герберт Уэллс",
        color: "#0d47a1",
        currentPage: 0,
        bookmarks: [],
        pages: [
          "Глава I.\n\nПутешественник по Времени излагал нам весьма спорную мысль. Его серые глаза горели оживлением, а обычно бледное лицо разрумянилось от спора.\n\n— Вы должны внимательно следовать за моей мыслью, — говорил он. — Общепринятая геометрия покоится на чистейшем заблуждении. Математики утверждают, что длина, ширина и толщина суть три измерения пространства. Но они забывают о четвертом...",
          "— Четвертое измерение — это Время, — продолжал он, обводя взглядом собравшихся у камина гостей. — Нет никакой разницы между Временем и тремя другими измерениями Пространства, кроме той, что наше сознание движется вдоль него только в одном направлении.\n\nС этими словами он снял шелковый покров с маленького изящного механизма из латуни и горного хрусталя."
        ]
      },
      {
        id: "b3",
        title: "Собака Баскервилей",
        author: "Артур Конан Дойл",
        color: "#8d2b2b",
        currentPage: 0,
        bookmarks: [],
        pages: [
          "Глава I. Мистер Шерлок Холмс.\n\nШерлок Холмс сидел за столом и пил утренний чай. Я стоял на коврике у камина и разглядывал трость, забытую нашим вчерашним ночным посетителем.\n\nЭто была толстая дубовая палка с набалдашником из капа — из тех, что зовут «докторскими». Чуть ниже набалдашника красовалась серебряная пластинка с надписью: «Джеймсу Мортимеру от друзей по ЧКХ, 1884 г.»",
          "— Ну, Уотсон, какого вы мнения об этом предмете? — спросил Холмс, не оборачиваясь от кофейника.\n\n— Откуда вы знаете, чем я занят? Можно подумать, у вас глаза на затылке!\n\n— На затылке глаз нет, зато передо мной начищенный серебряный кофейник, — усмехнулся мой гениальный друг."
        ]
      }
    ];

    let books = [];
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      books = saved ? JSON.parse(saved) : defaultBooks;
    } catch(e) {
      books = defaultBooks;
    }

    let userSettings = {
      fontSize: 18,
      margin: 'normal',
      fontFamily: 'serif',
      theme: 'sepia'
    };
    try {
      const savedSettings = localStorage.getItem(SETTINGS_KEY);
      if (savedSettings) userSettings = Object.assign(userSettings, JSON.parse(savedSettings));
    } catch(e) {}

    let activeBookId = null;
    let isHudVisible = false;
    let isFlipping = false;

    // DOM
    const shelfEl = document.getElementById('bookshelf');
    const readerScreen = document.getElementById('reader-screen');
    const readerStage = document.getElementById('reader-stage');
    const bookBodyEl = document.getElementById('book-body');
    const footerPageInfo = document.getElementById('footer-page-info');
    const footerBookAuthor = document.getElementById('footer-book-author');
    const ribbonEl = document.getElementById('translucent-ribbon');
    const toastPill = document.getElementById('toast-pill');

    // 3D Leaf
    const leafEl = document.getElementById('flipping-leaf');
    const leafBody = document.getElementById('leaf-body');
    const leafPageInfo = document.getElementById('leaf-page-info');
    const leafBookAuthor = document.getElementById('leaf-book-author');

    // HUD
    const readerHud = document.getElementById('reader-hud');
    const hudBookTitle = document.getElementById('hud-book-title');
    const hudBookmarkBtn = document.getElementById('hud-bookmark-btn');
    const hudBackBtn = document.getElementById('hud-back-btn');
    const pageScrubber = document.getElementById('page-scrubber');
    const scrubberLabel = document.getElementById('scrubber-label');
    const fontSizeLabel = document.getElementById('font-size-label');

    // Модалка
    const addModal = document.getElementById('add-modal');

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
    }

    function saveSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(userSettings));
      applySettings();
    }

    function showToast(msg) {
      toastPill.textContent = msg;
      toastPill.classList.add('show');
      setTimeout(() => toastPill.classList.remove('show'), 2200);
    }

    function applySettings() {
      document.body.className = `theme-${userSettings.theme}`;
      document.documentElement.style.setProperty('--font-size', `${userSettings.fontSize}px`);
      fontSizeLabel.textContent = `${userSettings.fontSize}px`;

      const marginMap = { narrow: '0.8rem', normal: '1.4rem', wide: '2.2rem' };
      document.documentElement.style.setProperty('--margin-h', marginMap[userSettings.margin] || '1.4rem');

      const fontMap = {
        serif: 'Georgia, "Times New Roman", serif',
        sans: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
      };
      document.documentElement.style.setProperty('--font-family', fontMap[userSettings.fontFamily]);

      document.querySelectorAll('[data-margin]').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.margin === userSettings.margin);
      });
      document.querySelectorAll('[data-font]').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.font === userSettings.fontFamily);
      });
      document.querySelectorAll('.theme-dot').forEach(dot => {
        dot.classList.toggle('selected', dot.dataset.theme === userSettings.theme);
      });
    }

    function renderShelf() {
      shelfEl.innerHTML = '';
      books.forEach(b => {
        const item = document.createElement('div');
        item.className = 'book-item';
        item.style.backgroundColor = b.color || '#8d2b2b';

        const hasManualBm = b.bookmarks && b.bookmarks.length > 0;
        const progress = Math.round(((b.currentPage + 1) / b.pages.length) * 100);

        item.innerHTML = `
          <div class="book-title">${escapeHtml(b.title)}</div>
          <div class="book-meta">
            <span>${progress}%</span>
            <span class="bookmark-flag">${hasManualBm ? '🔖' : '📍'}</span>
          </div>
        `;
        item.onclick = () => openReader(b.id);
        shelfEl.appendChild(item);
      });
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function openReader(id) {
      activeBookId = id;
      const b = books.find(x => x.id === id);
      if (!b) return;

      hudBookTitle.textContent = b.title;
      footerBookAuthor.textContent = b.author || '';

      pageScrubber.max = b.pages.length;
      pageScrubber.value = b.currentPage + 1;

      // Устанавливаем индивидуальный цвет полупрозрачной закладки для книги
      const ribbonColor = ribbonColorMap[b.color] || 'rgba(216, 67, 21, 0.45)';
      ribbonEl.style.background = `linear-gradient(180deg, ${ribbonColor} 0%, rgba(255,255,255,0.18) 100%)`;

      readerScreen.classList.add('active');
      renderPageDOM(b);

      showToast('Свайп вверх — меню • Двойной тап — закладка');
    }

    function renderPageDOM(b) {
      bookBodyEl.textContent = b.pages[b.currentPage] || '';
      bookBodyEl.scrollTop = 0;

      footerPageInfo.textContent = `Стр. ${b.currentPage + 1} из ${b.pages.length}`;
      pageScrubber.value = b.currentPage + 1;
      scrubberLabel.textContent = `${b.currentPage + 1} / ${b.pages.length}`;

      const isManual = b.bookmarks && b.bookmarks.includes(b.currentPage);

      // Логика закладок:
      // 1. Ручная закладка: яркая полупрозрачная лента на всю длину.
      // 2. Авто-закладка (где остановился): нежная полупрозрачная метка.
      if (isManual) {
        ribbonEl.className = 'translucent-ribbon visible';
        hudBookmarkBtn.classList.add('active-bm');
        hudBookmarkBtn.textContent = '✓ Закладка снята';
      } else {
        // Автоматическая закладка текущего прогресса
        ribbonEl.className = 'translucent-ribbon visible auto-mode';
        hudBookmarkBtn.classList.remove('active-bm');
        hudBookmarkBtn.textContent = '🔖 Поставить закладку';
      }

      saveState();
    }

    // ==========================================
    // РЕАЛИСТИЧНОЕ 3D ПЕРЕЛИСТЫВАНИЕ СТРАНИЦЫ
    // ==========================================
    function flipPageTo(targetIndex, direction) {
      const b = books.find(x => x.id === activeBookId);
      if (!b || isFlipping) return;

      if (targetIndex < 0 || targetIndex >= b.pages.length) return;

      isFlipping = true;

      // Подготавливаем анимируемый лист с текущим текстом
      leafBody.textContent = b.pages[b.currentPage] || '';
      leafPageInfo.textContent = `Стр. ${b.currentPage + 1} из ${b.pages.length}`;
      leafBookAuthor.textContent = b.author || '';

      // Переключаем нижний лист на следующую страницу заранее
      b.currentPage = targetIndex;
      renderPageDOM(b);

      // Запускаем 3D-анимацию изгиба страницы
      const animClass = direction === 'forward' ? 'active-forward' : 'active-back';
      leafEl.className = `flipping-leaf page-surface ${animClass}`;

      setTimeout(() => {
        leafEl.className = 'flipping-leaf page-surface';
        isFlipping = false;
      }, 510);
    }

    function nextPage() {
      const b = books.find(x => x.id === activeBookId);
      if (b && b.currentPage < b.pages.length - 1) {
        flipPageTo(b.currentPage + 1, 'forward');
      }
    }

    function prevPage() {
      const b = books.find(x => x.id === activeBookId);
      if (b && b.currentPage > 0) {
        flipPageTo(b.currentPage - 1, 'back');
      }
    }

    function toggleHud() {
      isHudVisible = !isHudVisible;
      readerHud.classList.toggle('active', isHudVisible);
    }

    function toggleBookmark() {
      const b = books.find(x => x.id === activeBookId);
      if (!b) return;
      if (!b.bookmarks) b.bookmarks = [];

      const idx = b.bookmarks.indexOf(b.currentPage);
      if (idx === -1) {
        b.bookmarks.push(b.currentPage);
        showToast('🔖 Закладка установлена');
      } else {
        b.bookmarks.splice(idx, 1);
        showToast('📍 Закладка снята (автопозиция сохранена)');
      }
      renderPageDOM(b);
    }

    // ==========================================
    // ЖЕСТЫ: СВАЙП ВВЕРХ ДЛЯ МЕНЮ, ДВОЙНОЙ ТАП ДЛЯ ЗАКЛАДКИ
    // ==========================================
    let touchStartX = 0;
    let touchStartY = 0;
    let lastTapTime = 0;

    readerScreen.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    readerScreen.addEventListener('touchend', (e) => {
      if (e.changedTouches.length !== 1) return;

      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;

      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      // 1. СВАЙП ВВЕРХ: открывает меню, а если меню открыто — также свайп вверх закрывает его!
      if (diffY < -45 && Math.abs(diffY) > Math.abs(diffX) * 1.2) {
        toggleHud();
        return;
      }

      // Если открыто меню, горизонтальные свайпы не перелистывают
      if (isHudVisible) return;

      // 2. ГОРИЗОНТАЛЬНЫЙ СВАЙП: перелистывание как в книге
      if (Math.abs(diffX) > 42 && Math.abs(diffX) > Math.abs(diffY) * 1.3) {
        if (diffX < 0) {
          nextPage(); // Влево -> вперед
        } else {
          prevPage(); // Вправо -> назад
        }
        return;
      }

      // 3. ДВОЙНОЙ ТАП: ставит или снимает закладку
      const now = Date.now();
      const timeDiff = now - lastTapTime;
      if (timeDiff < 320 && Math.abs(diffX) < 16 && Math.abs(diffY) < 16) {
        toggleBookmark();
        lastTapTime = 0;
      } else {
        lastTapTime = now;
      }
    }, { passive: true });

    // Двойной клик мышью на ПК
    readerStage.addEventListener('dblclick', () => {
      toggleBookmark();
    });

    // ==========================================
    // КНОПКИ В МЕНЮ ЧИТАЛКИ
    // ==========================================
    hudBackBtn.onclick = () => {
      readerScreen.classList.remove('active');
      isHudVisible = false;
      readerHud.classList.remove('active');
      renderShelf();
    };

    hudBookmarkBtn.onclick = () => {
      toggleBookmark();
    };

    pageScrubber.oninput = (e) => {
      const b = books.find(x => x.id === activeBookId);
      if (!b) return;
      const targetPage = parseInt(e.target.value, 10) - 1;
      b.currentPage = Math.max(0, Math.min(targetPage, b.pages.length - 1));
      renderPageDOM(b);
    };

    document.getElementById('font-inc').onclick = () => {
      if (userSettings.fontSize < 32) {
        userSettings.fontSize += 2;
        saveSettings();
      }
    };

    document.getElementById('font-dec').onclick = () => {
      if (userSettings.fontSize > 12) {
        userSettings.fontSize -= 2;
        saveSettings();
      }
    };

    document.querySelectorAll('[data-margin]').forEach(btn => {
      btn.onclick = () => {
        userSettings.margin = btn.dataset.margin;
        saveSettings();
      };
    });

    document.querySelectorAll('[data-font]').forEach(btn => {
      btn.onclick = () => {
        userSettings.fontFamily = btn.dataset.font;
        saveSettings();
      };
    });

    document.querySelectorAll('.theme-dot').forEach(dot => {
      dot.onclick = () => {
        userSettings.theme = dot.dataset.theme;
        saveSettings();
      };
    });

    // ==========================================
    // ДОБАВЛЕНИЕ НОВОЙ КНИГИ
    // ==========================================
    document.getElementById('open-add-dialog').onclick = () => addModal.classList.add('active');
    document.getElementById('cancel-add').onclick = () => addModal.classList.remove('active');

    document.getElementById('save-book').onclick = () => {
      const titleInput = document.getElementById('new-title').value.trim();
      const authorInput = document.getElementById('new-author').value.trim() || 'Не указан';
      const colorInput = document.getElementById('new-color').value;
      const textInput = document.getElementById('new-text').value.trim();

      if (!titleInput) {
        alert('Пожалуйста, укажите название книги');
        return;
      }

      let pages = textInput.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
      if (!pages.length) pages = ["Страница 1. Текст книги пока пуст."];

      const newBook = {
        id: 'book_' + Date.now(),
        title: titleInput,
        author: authorInput,
        color: colorInput,
        currentPage: 0,
        bookmarks: [],
        pages: pages
      };

      books.push(newBook);
      saveState();
      renderShelf();

      document.getElementById('new-title').value = '';
      document.getElementById('new-author').value = '';
      document.getElementById('new-text').value = '';
      addModal.classList.remove('active');
    };

    // Клавиатура ПК для тестов
    window.addEventListener('keydown', (e) => {
      if (!readerScreen.classList.contains('active')) return;
      if (e.key === 'ArrowRight') nextPage();
      if (e.key === 'ArrowLeft') prevPage();
      if (e.key === 'ArrowUp') toggleHud();
      if (e.key === 'b' || e.key === 'B' || e.key === 'и' || e.key === 'И') toggleBookmark();
      if (e.key === 'Escape') {
        if (isHudVisible) {
          toggleHud();
        } else {
          hudBackBtn.click();
        }
      }
    });

    applySettings();
    renderShelf();
  </script>
</body>
</html>
